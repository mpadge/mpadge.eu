    title: "Distributed Git"
    description: How to redefine <code>git push</code> for an era of distributed code. No canonical source; no platform lock-in. A re-implementation of <code>git push</code> that sends your code anywhere and everywhere. Nice features like branch protection are still possible, but able to defined locally, remotely, or both. Single locations can be defined as "canonical" upstream sources. Or code can have no canonical source, and just spread out and be used and interacted with wherever people like.
    created: 10 Nov 26
    mastodon: https://nerdculture.de/@mpadge/117591605285184316
    tags: code, git
    link: blog/git-push.html
